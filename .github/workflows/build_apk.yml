name: Build Sultan Pharma APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
        working-directory: sultan-pharma-app

      - name: Build APK
        run: flutter build apk --release
        working-directory: sultan-pharma-app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sultan-pharma-release
          path: sultan-pharma-app/build/app/outputs/flutter-apk/app-release.apk
          
